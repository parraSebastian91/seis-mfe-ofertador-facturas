<app-toast-container></app-toast-container>

<app-modal-confirmacion-oferta
  [mostrar]="mostrarModalConfirmacion"
  [resumen]="resumenOfertaModal"
  (confirmado)="onOfertaConfirmada()"
  (cancelado)="onOfertaCancelada()"
>
</app-modal-confirmacion-oferta>

<!-- ─── Layout: CA-01 responsive (HU-27) ─────────────────────────────────── -->
<div class="page-layout">
  <!-- Drawer overlay (md breakpoint) -->
  <div
    class="drawer-overlay"
    [class.open]="drawerOpen"
    (click)="drawerOpen = false"
    (keydown.escape)="drawerOpen = false"
    aria-hidden="true"
  ></div>

  <!-- Columna 1: Lista de facturas (1/5 lg+, drawer en md) -->
  <aside
    class="col-marketplace"
    [class.drawer-open]="drawerOpen"
    aria-label="Lista de facturas disponibles"
  >

      [facturaSeleccionadaId]="facturaSeleccionada?.facturaId ?? null"

      > -->
    <app-cartera-leads> </app-cartera-leads>
  </aside>

  <!-- FAB para abrir drawer en mobile/tablet -->
  <button
    type="button"
    class="btn-drawer-fab"
    (click)="drawerOpen = !drawerOpen"
    aria-label="Ver lista de facturas"
    [attr.aria-expanded]="drawerOpen"
  >
    &#9776;
  </button>

  <!-- Columna 2-4: Secciones de detalle (4/5 lg+) -->
  <main class="col-detalle" aria-label="Detalle de factura">
